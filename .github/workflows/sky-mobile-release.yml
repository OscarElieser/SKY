name: SKY Android Signed Release Candidate
permissions:
  contents: read
concurrency:
  group: sky-android-signed-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/android-agent/**'
      - '.github/workflows/sky-mobile-release.yml'
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare privately stored release key
        shell: bash
        env:
          SKY_ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.SKY_ANDROID_RELEASE_KEYSTORE_B64 }}
          SKY_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SKY_ANDROID_RELEASE_STORE_PASSWORD }}
          SKY_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.SKY_ANDROID_RELEASE_KEY_ALIAS }}
          SKY_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SKY_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SKY_ANDROID_RELEASE_KEYSTORE_B64 SKY_ANDROID_RELEASE_STORE_PASSWORD SKY_ANDROID_RELEASE_KEY_ALIAS SKY_ANDROID_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required repository secret: $name"
              exit 1
            fi
          done
          umask 077
          key_file="$RUNNER_TEMP/sky-mobile-release.p12"
          printf '%s' "$SKY_ANDROID_RELEASE_KEYSTORE_B64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "SKY_ANDROID_RELEASE_KEYSTORE=$key_file" >> "$GITHUB_ENV"
      - name: Run unit tests and build stable signed standard APK
        env:
          SKY_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.SKY_ANDROID_RELEASE_STORE_PASSWORD }}
          SKY_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.SKY_ANDROID_RELEASE_KEY_ALIAS }}
          SKY_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.SKY_ANDROID_RELEASE_KEY_PASSWORD }}
          SKY_ANDROID_REQUIRE_SIGNED_RELEASE: 'true'
        run: |
          set -euo pipefail
          gradle -p mobile/android-agent :app:testStandardDebugUnitTest :app:assembleStandardRelease --no-daemon
      - name: Verify signature, package and safe manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/android-agent/app/build/outputs/apk/standard/release/app-standard-release.apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='ni.sky.mobileagent'"
          manifest_dump=$("$build_tools/aapt" dump xmltree "$apk" AndroidManifest.xml)
          if printf '%s\n' "$manifest_dump" |
            grep -Eq 'SkyTextAssistService|SkyMusicControlService|android.permission.BIND_ACCESSIBILITY_SERVICE|android.accessibilityservice.AccessibilityService'; then
            echo "::error::Standard signed APK cannot contain AccessibilityService"
            exit 1
          fi
          mkdir -p mobile/android-agent/apk
          cp "$apk" mobile/android-agent/apk/SKY-IA-Android-standard-release.apk
          cd mobile/android-agent/apk
          sha256sum SKY-IA-Android-standard-release.apk > SKY-IA-Android-standard-release.apk.sha256
          "$build_tools/apksigner" verify --print-certs SKY-IA-Android-standard-release.apk |
            grep -F 'Signer #1 certificate SHA-256 digest:' > signer-fingerprint.txt
          test -s signer-fingerprint.txt
          "$build_tools/aapt" dump badging "SKY-IA-Android-standard-release.apk" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" > version.txt
          test -s version.txt
      - name: Attach signed release candidate for device tests (not Play certified)
        uses: actions/upload-artifact@v4
        with:
          name: sky-mobile-standard-signed-release
          path: |
            mobile/android-agent/apk/SKY-IA-Android-standard-release.apk
            mobile/android-agent/apk/SKY-IA-Android-standard-release.apk.sha256
            mobile/android-agent/apk/signer-fingerprint.txt
            mobile/android-agent/apk/version.txt
          if-no-files-found: error
          retention-days: 30

  # Impedir publicar la APK si falla la ejecución real en Android virtual.
  # Esto NO sustituye la validación manual en el Samsung del propietario.
  emulator-validation:
    name: Android emulator API ${{ matrix.api }} · real runtime
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Habilitar aceleración KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Probar aplicación en Android real virtualizado (no hardware Samsung)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle -p mobile/android-agent :app:connectedStandardDebugAndroidTest --no-daemon

  # Only this isolated job can write GitHub Releases.
  # Neither the Windows services nor other project workflows are altered.
  publish-android-download:
    name: Publish directly downloadable SKY Android beta
    needs: [signed-release, emulator-validation]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Android release package
        uses: actions/download-artifact@v4
        with:
          name: sky-mobile-standard-signed-release
          path: dist
      - name: Verify artifact integrity and prepare versioned APK
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check SKY-IA-Android-standard-release.apk.sha256
          test -s signer-fingerprint.txt
          version="$(cat version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Android version"; exit 1; }
          apk="SKY-IA-Android-v${version}-firmada.apk"
          mv SKY-IA-Android-standard-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "SKY_ANDROID_VERSION=$version" >> "$GITHUB_ENV"
          echo "SKY_ANDROID_APK=$apk" >> "$GITHUB_ENV"
      - name: Publish direct download in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="sky-android-v${SKY_ANDROID_VERSION}"
          # Nunca publicar una APK compilada desde un commit anterior al actual main.
          newest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$newest" != "$GITHUB_SHA" ]]; then
            echo "No publicar versión obsoleta: main avanzó desde el inicio de esta compilación."
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump app versionCode/versionName before publishing a new APK."
            exit 0
          fi
          gh release create "$tag" \
            "dist/${SKY_ANDROID_APK}" \
            "dist/${SKY_ANDROID_APK}.sha256" \
            "dist/signer-fingerprint.txt" \
            --target "$GITHUB_SHA" \
            --title "SKY Android v${SKY_ANDROID_VERSION} — beta personal" \
            --prerelease \
            --latest=false \
            --notes "SKY Android independiente de Windows y Tailscale. Compilación release firmada y verificada. APK para pruebas personales, no certificada por Google Play. El acceso a Gemini se configura desde Android con la clave personal del usuario; no se integra ninguna clave en la APK. No instales APKs si Play Protect señala riesgos: revisá el aviso. Para distribuir públicamente, migrar las claves del cliente a un backend autenticado. Este lanzamiento NO modifica SKY Windows."
