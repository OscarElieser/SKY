name: SKY confiabilidad y evidencia operativa
on:
  pull_request:
    paths:
      - 'neural_core/factcheck_engine.py'
      - 'neural_core/windows_controller.py'
      - 'neural_core/sky_phone.py'
      - 'tests/test_sky_operational_safety.py'
      - '.github/workflows/sky-operational-safety.yml'
  push:
    branches: [main]
    paths:
      - 'neural_core/factcheck_engine.py'
      - 'neural_core/windows_controller.py'
      - 'neural_core/sky_phone.py'
      - 'tests/test_sky_operational_safety.py'
      - '.github/workflows/sky-operational-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias para pruebas
        run: python -m pip install 'pytest>=8,<10' 'sympy>=1.13,<2'
      - name: Validar sintaxis
        run: python -m py_compile neural_core/factcheck_engine.py neural_core/windows_controller.py neural_core/sky_phone.py tests/test_sky_operational_safety.py
      - name: Verificar que SKY no inventa hechos ni acciones terminadas
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_operational_safety.py
