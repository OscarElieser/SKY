name: SKY v10.9 full stack, independent recovery and optional real multilingual ASR
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies and synthetic media tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements_studio.txt -r requirements_production.txt pytest 'opencv-python-headless>=4.10,<5'
      - name: Tests global security, backup and voice
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_sky_v10_9_stack.py tests/test_sky_v10_8_operations.py
          tests/test_sky_v10_7_public.py tests/test_sky_v10_6_global.py
          tests/test_sky_v10_5_global.py tests/test_sky_v10_4_secure_global.py
          tests/test_sky_v10_3_global.py tests/test_sky_v10_2_global.py
          tests/test_sky_v10_1_security_languages.py
      - name: Tests creative, project and integration modules
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_sky_v10_creative.py tests/test_sky_v9_9_timeline.py
          tests/test_sky_v9_8_advanced.py tests/test_sky_v9_7_creative.py
          tests/test_sky_v9_6_context.py tests/test_sky_v9_5_intelligent.py
          tests/test_sky_v9_4_continuity.py tests/test_sky_v9_3_focus_workflows.py
          tests/test_sky_v9_2_project_hub.py tests/test_sky_v9_1_integration.py
          tests/test_sky_v9_orchestrator.py
      - name: Tests legacy engines, office and social
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_gemini_baqueano.py tests/test_local.py
          tests/test_multiia.py tests/test_sky_devices.py tests/test_sky_v5.py
          tests/test_sky_v6_metaverse.py tests/test_sky_v7_social.py
          tests/test_sky_v8_office.py
      - name: Static deployment audit
        run: python -m scripts.audit_stack_v109
      - name: Detect common secrets (not an external security audit)
        run: python scripts/security_audit_v103.py .
  full-compose-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build SKY app image
        run: docker build --pull -f deploy/Dockerfile -t sky-v109:local .
      - name: Check all 4 Docker services through locally trusted HTTPS
        run: bash scripts/ci_stack_smoke_v109.sh
      - name: Recover synthetic encrypted archive in independent offline container
        run: bash scripts/ci_cross_container_v109.sh
  voice-real-model:
    # Actual open-weight model downloaded only for an explicit dispatch.
    # No live-user voices or model weights are committed to the repository.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install voice runtime and synthesis program
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install 'faster-whisper>=1.1,<2' 'huggingface-hub>=0.23,<2' numpy
      - name: Download public tiny multilingual Whisper model for CI ONLY
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Systran/faster-whisper-tiny',
            local_dir='.ci_voice_model',
            allow_patterns=['config.json','model.bin','tokenizer.json','vocabulary.*','preprocessor_config.json'])
          PY
      - name: Generate three synthetic utterances; test actual model, not stubs
        run: |
          mkdir -p .ci_voice_samples
          espeak-ng -v es -s 120 -w .ci_voice_samples/spanish.wav "Hola, este es un ensayo del asistente SKY en español"
          espeak-ng -v fr -s 120 -w .ci_voice_samples/french.wav "Bonjour, ceci est un test de la voix de SKY en français"
          espeak-ng -v en -s 120 -w .ci_voice_samples/english.wav "Hello this is a test of multilingual voice recognition"
          python - <<'PY'
          import json
          rows=[
            {'file':'spanish.wav','language':'es','reference':'Hola, este es un ensayo del asistente SKY en español'},
            {'file':'french.wav','language':'fr','reference':'Bonjour, ceci est un test de la voix de SKY en français'},
            {'file':'english.wav','language':'en','reference':'Hello this is a test of multilingual voice recognition'}]
          with open('.ci_voice_samples/manifest.json','w') as f:json.dump(rows,f,ensure_ascii=False)
          PY
      - name: Measure genuine Whisper transcripts and WER (not production certified)
        env:
          SKY_STT_MODEL_DIR: ${{ github.workspace }}/.ci_voice_model
        run: |
          # A quality threshold is reported transparently; a failing quality test is a real finding.
          python -m scripts.benchmark_voice_multilingual_v108 \
            --manifest .ci_voice_samples/manifest.json --audio-dir .ci_voice_samples \
            --threshold 0.8 --out .ci_voice_samples/voice_report.json
      - name: Upload metrics only (never upload audio or transcripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sky-v109-voice-metrics
          path: .ci_voice_samples/voice_report.json
          if-no-files-found: ignore
          retention-days: 7
