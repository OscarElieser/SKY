name: SKY Skillpack verified adapters
on:
  push:
    branches: [main, 'feat/skillpack-*']
    paths:
      - 'neural_core/sky_skillpack.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_skillpack.py'
      - '.github/workflows/sky-skillpack-tests.yml'
  pull_request:
    paths:
      - 'neural_core/sky_skillpack.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_skillpack.py'
      - '.github/workflows/sky-skillpack-tests.yml'
permissions:
  contents: read
jobs:
  verified-skillpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only required dependencies for isolated tests
        run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Compile modules
        run: python -m compileall -q neural_core/sky_skillpack.py metaverse/api.py tests/test_sky_skillpack.py
      - name: Offline behavioral and security regressions
        run: python -m pytest -q tests/test_sky_skillpack.py
