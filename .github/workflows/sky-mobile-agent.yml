name: SKY Mobile Android Agent
permissions:
  contents: read
concurrency:
  group: sky-mobile-agent-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/sentinel.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/mobile_chat_api.py'
      - 'metaverse/static/hud.js'
      - 'neural_core/sky_mobile_chat.py'
      - 'neural_core/sky_inference_gateway.py'
      - 'tests/test_sky_inference_gateway.py'
      - 'metaverse/sky_home_api.py'
      - 'tests/test_sky_mobile_chat.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
  pull_request:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/sentinel.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/mobile_chat_api.py'
      - 'metaverse/static/hud.js'
      - 'neural_core/sky_mobile_chat.py'
      - 'neural_core/sky_inference_gateway.py'
      - 'tests/test_sky_inference_gateway.py'
      - 'metaverse/sky_home_api.py'
      - 'tests/test_sky_mobile_chat.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1'
      - name: Python syntax
        run: python -m py_compile metaverse/sentinel.py neural_core/sky_mobile_agent.py neural_core/sky_mobile_chat.py neural_core/sky_inference_gateway.py metaverse/mobile_agent_api.py metaverse/mobile_chat_api.py metaverse/sky_home_api.py metaverse/asistente_api.py metaverse/api.py
      - name: Consent and queue tests
        run: python -m pytest -q tests/test_sky_mobile_agent.py tests/test_sky_mobile_chat.py tests/test_sky_inference_gateway.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile standard Android debug APK without accessibility service
        run: gradle -p mobile/android-agent :app:assembleStandardDebug --no-daemon
      - name: Validate voice, application routing, and device commands
        run: gradle -p mobile/android-agent :app:testStandardDebugUnitTest --no-daemon
      - name: Verify standard APK has no accessibility services or binding
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/android-agent/app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          manifest_dump=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml)
          if printf '%s\n' "$manifest_dump" |
            grep -Eq 'SkyTextAssistService|SkyMusicControlService|android.permission.BIND_ACCESSIBILITY_SERVICE|android.accessibilityservice.AccessibilityService'; then
            echo "::error::Standard APK must not declare any accessibility service"
            exit 1
          fi
      - name: Verify release signing with a disposable CI key (never distributed)
        shell: bash
        run: |
          set -euo pipefail
          temp_key="$RUNNER_TEMP/sky-ci-throwaway.p12"
          keytool -genkeypair -noprompt -keystore "$temp_key" -storetype PKCS12 \
            -alias sky-ci -keyalg RSA -keysize 3072 -validity 1 \
            -dname "CN=SKY Android CI, OU=Tests, O=SKY" \
            -storepass ci-only-pass123 -keypass ci-only-pass123
          export SKY_ANDROID_RELEASE_KEYSTORE="$temp_key"
          export SKY_ANDROID_RELEASE_STORE_PASSWORD="ci-only-pass123"
          export SKY_ANDROID_RELEASE_KEY_ALIAS="sky-ci"
          export SKY_ANDROID_RELEASE_KEY_PASSWORD="ci-only-pass123"
          export SKY_ANDROID_REQUIRE_SIGNED_RELEASE="true"
          gradle -p mobile/android-agent :app:assembleStandardRelease --no-daemon
          signed_apk="mobile/android-agent/app/build/outputs/apk/standard/release/app-standard-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$signed_apk"
          rm -f "$temp_key"
      - name: Stage SKY Android APK in its isolated folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android-agent/apk
          cp mobile/android-agent/app/build/outputs/apk/standard/debug/app-standard-debug.apk \
            mobile/android-agent/apk/SKY-IA-Android-standard-debug.apk
          cd mobile/android-agent/apk
          sha256sum SKY-IA-Android-standard-debug.apk > SKY-IA-Android-standard-debug.apk.sha256
          test -s SKY-IA-Android-standard-debug.apk
      - name: Attach development APK (not device-validated)
        uses: actions/upload-artifact@v4
        with:
          name: sky-mobile-standard-debug
          path: |
            mobile/android-agent/apk/SKY-IA-Android-standard-debug.apk
            mobile/android-agent/apk/SKY-IA-Android-standard-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
