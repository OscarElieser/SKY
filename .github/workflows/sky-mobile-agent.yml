name: SKY Mobile Android Agent
permissions:
  contents: read
concurrency:
  group: sky-mobile-agent-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/mobile_chat_api.py'
      - 'metaverse/static/hud.js'
      - 'neural_core/sky_mobile_chat.py'
      - 'metaverse/sky_home_api.py'
      - 'tests/test_sky_mobile_chat.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
  pull_request:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/mobile_chat_api.py'
      - 'metaverse/static/hud.js'
      - 'neural_core/sky_mobile_chat.py'
      - 'metaverse/sky_home_api.py'
      - 'tests/test_sky_mobile_chat.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1'
      - name: Python syntax
        run: python -m py_compile neural_core/sky_mobile_agent.py neural_core/sky_mobile_chat.py metaverse/mobile_agent_api.py metaverse/mobile_chat_api.py metaverse/sky_home_api.py metaverse/asistente_api.py metaverse/api.py
      - name: Consent and queue tests
        run: python -m pytest -q tests/test_sky_mobile_agent.py tests/test_sky_mobile_chat.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        run: gradle -p mobile/android-agent :app:assembleDebug --no-daemon
      - name: Validate spoken and typed panel routing
        run: gradle -p mobile/android-agent :app:testDebugUnitTest --no-daemon
      - name: Stage SKY Android APK in its isolated folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/android-agent/apk
          cp mobile/android-agent/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android-agent/apk/SKY-IA-Android-debug.apk
          cd mobile/android-agent/apk
          sha256sum SKY-IA-Android-debug.apk > SKY-IA-Android-debug.apk.sha256
          test -s SKY-IA-Android-debug.apk
      - name: Attach development APK (not device-validated)
        uses: actions/upload-artifact@v4
        with:
          name: sky-mobile-agent-debug
          path: |
            mobile/android-agent/apk/SKY-IA-Android-debug.apk
            mobile/android-agent/apk/SKY-IA-Android-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
