name: SKY Mobile Android Agent
on:
  push:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
  pull_request:
    paths:
      - 'neural_core/sky_mobile_agent.py'
      - 'metaverse/mobile_agent_api.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/api.py'
      - 'mobile/android-agent/**'
      - 'tests/test_sky_mobile_agent.py'
      - '.github/workflows/sky-mobile-agent.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Python syntax
        run: python -m py_compile neural_core/sky_mobile_agent.py metaverse/mobile_agent_api.py metaverse/asistente_api.py metaverse/api.py
      - name: Consent and queue tests
        run: python -m pytest -q tests/test_sky_mobile_agent.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        run: gradle -p mobile/android-agent :app:assembleDebug --no-daemon
