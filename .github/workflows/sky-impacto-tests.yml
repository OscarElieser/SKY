name: SKY Impacto - educación, investigación e innovación
on:
  pull_request:
    paths:
      - 'neural_core/sky_impacto.py'
      - 'neural_core/sky_scholarly.py'
      - 'neural_core/sky_pro_skills.py'
      - 'tests/test_sky_scholarly_skills.py'
      - 'metaverse/impacto_api.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_impacto.py'
      - '.github/workflows/sky-impacto-tests.yml'
  push:
    branches: [main]
    paths:
      - 'neural_core/sky_impacto.py'
      - 'metaverse/impacto_api.py'
      - 'tests/test_sky_impacto.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  impacto-unitario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias ligeras del módulo
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9,<1'
      - name: Compilar módulos modificados
        run: |
          python -m py_compile neural_core/sky_impacto.py neural_core/sky_scholarly.py neural_core/sky_pro_skills.py metaverse/impacto_api.py
          python -m py_compile neural_core/assistant.py neural_core/sky_cerebro.py neural_core/sky_asistente_personal.py metaverse/api.py
      - name: Verificar funciones reales sin acceso a internet
        run: PYTHONPATH=. pytest -q tests/test_sky_impacto.py tests/test_sky_scholarly_skills.py
