name: SKY Instagram credential security regression
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/sky-instagram/**'
      - 'tests/sky_instagram_credential.test.mjs'
      - '.github/workflows/sky-instagram-credential.yml'
  pull_request:
    paths:
      - 'supabase/functions/sky-instagram/**'
      - 'tests/sky_instagram_credential.test.mjs'
      - '.github/workflows/sky-instagram-credential.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instagram-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test production Instagram credential generator
        run: node --test tests/sky_instagram_credential.test.mjs
