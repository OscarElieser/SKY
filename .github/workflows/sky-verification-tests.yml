name: SKY Verification Lab — video priorities

on:
  pull_request:
    paths:
      - 'neural_core/sky_verification_lab.py'
      - 'metaverse/verification_api.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_verification_lab.py'
      - 'scripts/sky_windows_acceptance.py'
      - '.github/workflows/sky-verification-tests.yml'
  push:
    branches: [main]
    paths:
      - 'neural_core/sky_verification_lab.py'
      - 'metaverse/verification_api.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_verification_lab.py'
      - 'scripts/sky_windows_acceptance.py'
      - '.github/workflows/sky-verification-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements_social.txt -r requirements_studio.txt pytest
      - name: Validate Python syntax
        run: python -m py_compile neural_core/sky_verification_lab.py metaverse/verification_api.py metaverse/api.py tests/test_sky_verification_lab.py scripts/sky_windows_acceptance.py
      - name: Run verification, scholarship and academy regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_verification_lab.py tests/test_sky_core_consolidation.py tests/test_sky_academy_innovation.py tests/test_sky_scholarly_skills.py
