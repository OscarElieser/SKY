name: SKY Creative Evolution 9 languages
on:
  pull_request:
    paths:
      - 'neural_core/sky_creative_evolution.py'
      - 'metaverse/creative_evolution_api.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_creative_evolution.py'
      - '.github/workflows/sky-creative-evolution.yml'
  push:
    branches:
      - 'integracion/sky-creative-evolution-multilingual'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creative-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install pytest
      - name: Compile creative modules and existing SKY
        run: |
          python -m py_compile neural_core/sky_creative_evolution.py metaverse/creative_evolution_api.py metaverse/api.py
      - name: Test SKY creative generation contracts and provider regressions
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_creative_evolution.py tests/test_sky_unified_agents.py tests/test_sky_openjarvis_integration.py tests/test_multiia.py
