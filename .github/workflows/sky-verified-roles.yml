name: SKY Verified Roles - Tool Execution Checks
on:
  push:
    branches: [main]
    paths:
      - 'neural_core/sky_verified_roles.py'
      - 'neural_core/sky_role_lessons.py'
      - 'neural_core/sky_role_router.py'
      - 'neural_core/sky_conversation_tools.py'
      - 'neural_core/sky_asistente_personal.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/sky_home_api.py'
      - 'metaverse/mobile_chat_api.py'
      - 'neural_core/sky_verified_science.py'
      - 'metaverse/sky_verified_roles_api.py'
      - 'metaverse/api.py'
      - 'neural_core/sky_safe_file_inspector.py'
      - 'metaverse/sky_safe_files_api.py'
      - 'tests/test_sky_safe_file_inspector.py'
      - 'tests/test_sky_verified_roles.py'
      - 'tests/test_sky_role_lessons.py'
      - 'tests/test_sky_role_router.py'
      - 'tests/test_sky_conversation_tools.py'
      - 'tests/test_sky_verified_json.py'
      - 'tests/test_sky_role_http.py'
      - 'neural_core/sky_safe_workspace.py'
      - 'neural_core/sky_safe_file_edits.py'
      - 'neural_core/sky_file_intents.py'
      - 'tests/test_sky_file_intents.py'
      - 'metaverse/sky_safe_files_api.py'
      - 'tests/test_sky_safe_files.py'
      - 'tests/test_sky_safe_file_edits.py'
      - 'metaverse/static/hud.html'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_verified_science.py'
      - 'tests/test_sky_verified_runtime_v2.py'
      - '.github/workflows/sky-verified-roles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify SKY roles (offline)
        run: |
          python -m py_compile neural_core/sky_file_intents.py neural_core/sky_safe_workspace.py metaverse/sky_safe_files_api.py neural_core/sky_conversation_tools.py neural_core/sky_asistente_personal.py metaverse/asistente_api.py metaverse/sky_home_api.py neural_core/sky_role_router.py neural_core/sky_role_lessons.py neural_core/sky_verified_roles.py neural_core/sky_verified_science.py metaverse/sky_verified_roles_api.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_verified_*.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_role_lessons.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_role_router.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_conversation_tools.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_verified_json.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_safe_file_inspector.py' -v
          node --check metaverse/static/hud.js

  http-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal HTTP test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Test HTTP routing and scoped Android credentials (isolated API)
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_role_http.py' -v


  safe-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal workspace and Office dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-docx>=1.1,<2' 'XlsxWriter>=3.2,<4' 'python-pptx>=1.0,<2' 'reportlab>=4.4,<5'
      - name: Test real file operations, approvals, Office files and HTTP
        run: |
          python -m py_compile neural_core/sky_safe_file_edits.py neural_core/sky_safe_workspace.py metaverse/sky_safe_files_api.py
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_safe_files.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_safe_file_edits.py' -v
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_sky_file_intents.py' -v
