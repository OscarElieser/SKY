name: SKY operational cycle and mobile install
on:
  push:
    branches: [main, 'feat/sky-operational-*']
    paths:
      - 'neural_core/sky_execution_cycle.py'
      - 'neural_core/action_verifier.py'
      - 'neural_core/windows_controller.py'
      - 'neural_core/dispositivos.py'
      - 'agente_dispositivo.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/mobile_pwa_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'metaverse/static/hud.html'
      - 'metaverse/static/sky-*'
      - 'tests/test_sky_execution_cycle.py'
      - '.github/workflows/sky-operational-cycle.yml'
  pull_request:
    paths:
      - 'neural_core/sky_execution_cycle.py'
      - 'neural_core/action_verifier.py'
      - 'neural_core/windows_controller.py'
      - 'neural_core/dispositivos.py'
      - 'agente_dispositivo.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/mobile_pwa_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'metaverse/static/hud.html'
      - 'metaverse/static/sky-*'
      - 'tests/test_sky_execution_cycle.py'
      - '.github/workflows/sky-operational-cycle.yml'
permissions:
  contents: read
jobs:
  operational-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted test requirements
        run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1' 'fastapi>=0.115,<1'
      - name: Compile server and device agent
        run: python -m compileall -q neural_core/sky_execution_cycle.py neural_core/action_verifier.py neural_core/windows_controller.py neural_core/dispositivos.py metaverse/asistente_api.py metaverse/mobile_pwa_api.py agente_dispositivo.py
      - name: Validate client JavaScript
        run: node --check metaverse/static/hud.js && node --check metaverse/static/sky-sw.js && node --check metaverse/static/sky-pwa-install.js
      - name: Offline execution, permissions and PWA regressions
        run: python -m pytest -q tests/test_sky_execution_cycle.py
