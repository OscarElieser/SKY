name: SKY Video Studio real render
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sky_video_studio.py'
      - 'tests/test_sky_video_studio.py'
      - 'scripts/sky_video_narration.py'
      - 'tests/test_sky_video_narration.py'
      - '.github/workflows/sky-video-studio.yml'
  pull_request:
    paths:
      - 'scripts/sky_video_studio.py'
      - 'tests/test_sky_video_studio.py'
      - 'scripts/sky_video_narration.py'
      - 'tests/test_sky_video_narration.py'
      - '.github/workflows/sky-video-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install pytest
      - name: Render and probe MP4
        run: python -m pytest -q tests/test_sky_video_studio.py tests/test_sky_video_narration.py
