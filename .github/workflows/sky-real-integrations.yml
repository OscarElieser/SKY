name: SKY real integrations voice academy and quality
on:
  push:
    branches: [main, 'feat/sky-integraciones-*']
    paths:
      - 'neural_core/sky_skillpack.py'
      - 'neural_core/sky_skillpack_extended.py'
      - 'neural_core/sky_skills_audit.py'
      - 'neural_core/sky_operational_quality.py'
      - 'neural_core/sky_execution_metrics.py'
      - 'neural_core/sky_aula.py'
      - 'metaverse/academy_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_final_integration.py'
      - 'tests/test_sky_skillpack.py'
      - 'sky_d3/**'
      - 'sky_remotion/**'
      - '.github/workflows/sky-real-integrations.yml'
  pull_request:
    paths:
      - 'neural_core/sky_skillpack.py'
      - 'neural_core/sky_skillpack_extended.py'
      - 'neural_core/sky_skills_audit.py'
      - 'neural_core/sky_operational_quality.py'
      - 'neural_core/sky_execution_metrics.py'
      - 'neural_core/sky_aula.py'
      - 'metaverse/academy_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_final_integration.py'
      - 'tests/test_sky_skillpack.py'
      - 'sky_d3/**'
      - 'sky_remotion/**'
      - '.github/workflows/sky-real-integrations.yml'
permissions:
  contents: read
jobs:
  unit-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scoped dependencies
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.18,<1' 'pypdf>=5,<7' 'python-docx>=1,<2' 'reportlab>=4,<5' 'openpyxl>=3,<4' 'cryptography>=45,<52'
      - name: Python compile
        run: python -m compileall -q neural_core/sky_skillpack.py neural_core/sky_skillpack_extended.py neural_core/sky_skills_audit.py neural_core/sky_operational_quality.py metaverse/academy_api.py metaverse/api.py tests/test_sky_final_integration.py
      - name: HUD JavaScript syntax
        run: node --check metaverse/static/hud.js
      - name: Unit and isolated integration suite
        run: python -m pytest -q tests/test_sky_skillpack.py tests/test_sky_final_integration.py tests/test_sky_execution_cycle.py
  d3-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project declared D3 runtime
        working-directory: sky_d3
        run: npm install --no-audit --no-fund
      - name: Real D3 render smoke
        working-directory: sky_d3
        run: printf '[4,8,3,12,7]' | node render.mjs | grep '<svg'
