name: SKY optional research models and n8n integration
on:
  push:
    branches: [main, 'feat/sky-safe-research-*']
    paths:
      - 'neural_core/sky_research_connectors.py'
      - 'neural_core/sky_research_commands.py'
      - 'neural_core/sky_n8n_bridge.py'
      - 'neural_core/providers.py'
      - 'neural_core/sky_integraciones.py'
      - 'neural_core/sky_asistente_personal.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_optional_expansion.py'
      - 'docs/SKY_OPTIONAL_EXPANSION.md'
      - '.github/workflows/sky-optional-expansion.yml'
  pull_request:
    paths:
      - 'neural_core/sky_research_connectors.py'
      - 'neural_core/sky_research_commands.py'
      - 'neural_core/sky_n8n_bridge.py'
      - 'neural_core/providers.py'
      - 'neural_core/sky_integraciones.py'
      - 'neural_core/sky_asistente_personal.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_optional_expansion.py'
      - 'docs/SKY_OPTIONAL_EXPANSION.md'
      - '.github/workflows/sky-optional-expansion.yml'
permissions:
  contents: read
jobs:
  secure-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1' 'fastapi>=0.115,<1'
      - name: Check Python syntax and core API
        run: python -m compileall -q neural_core/providers.py neural_core/sky_integraciones.py neural_core/sky_asistente_personal.py neural_core/sky_research_connectors.py neural_core/sky_research_commands.py neural_core/sky_n8n_bridge.py metaverse/api.py
      - name: Optional integration and existing skillpack regressions
        run: python -m pytest -q tests/test_sky_optional_expansion.py tests/test_sky_skillpack.py
