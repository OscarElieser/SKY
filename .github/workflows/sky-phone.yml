name: SKY Teléfono verified SMS voice and video
on:
  push:
    branches: [main, 'feat/sky-telefono-*']
    paths:
      - 'neural_core/sky_phone.py'
      - 'metaverse/phone_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_phone.py'
      - '.github/workflows/sky-phone.yml'
  pull_request:
    paths:
      - 'neural_core/sky_phone.py'
      - 'metaverse/phone_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_phone.py'
      - '.github/workflows/sky-phone.yml'
permissions:
  contents: read
jobs:
  security-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated tests
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.18,<1'
      - name: Compile Python modules
        run: python -m compileall -q neural_core/sky_phone.py metaverse/phone_api.py metaverse/api.py
      - name: Check holographic SKY HUD JS syntax
        run: node --check metaverse/static/hud.js
      - name: Test phone and existing regressions without real charges
        run: python -m pytest -q tests/test_sky_phone.py tests/test_sky_aula_multimedia_assessment.py tests/test_sky_execution_cycle.py
