name: SKY security and global regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video and voice tools
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg espeak
      - name: Install scoped test dependencies
        run: |
          python -m pip install -U pip 'setuptools>=83'
          python -m pip install -r requirements_studio.txt pytest opencv-python-headless cryptography pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit --local --progress-spinner off
      - name: Detect accidentally committed secrets
        run: python scripts/security_audit_v103.py .
      - name: Validate JavaScript syntax
        run: |
          node --check metaverse/static/sky-global-i18n.js
          node --check metaverse/static/creative.js
          node --check metaverse/static/hud.js
      - name: Test security, deployment and recovery controls
        run: >-
          PYTHONPATH=. pytest -q
          tests/test_sky_v10_1_security_languages.py
          tests/test_sky_v10_2_global.py
          tests/test_sky_v10_3_global.py
          tests/test_sky_v10_4_secure_global.py
          tests/test_sky_v10_5_global.py
          tests/test_sky_devices.py tests/test_sky_jarvis_local.py
          tests/test_sky_public_secrets.py tests/test_sky_notes_local.py
          tests/test_sky_v12_unificado.py tests/test_sky_v12_1_mejoras.py tests/test_sky_v12_2_aprendizaje_kpi.py tests/test_sky_v12_3_jarvis_completo.py tests/test_sky_v11_1_asistente.py
          tests/test_windows_desktop_control.py tests/test_sky_jarvis_fase1.py
