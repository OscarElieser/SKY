name: SKY Metaverse — functional worlds and real-time regression

on:
  pull_request:
    paths:
      - 'metaverse/static/sky3d.js'
      - 'metaverse/static/sky-world-physics.js'
      - 'metaverse/world_builder.py'
      - 'metaverse/api.py'
      - 'metaverse/static/index.html'
      - 'metaverse/static/sky.css'
      - 'tests/test_sky_metaverse_reliability.py'
      - 'tests/test_sky_world_builder.py'
      - 'tests/test_sky_world_physics.cjs'
      - '.github/workflows/sky-metaverse-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'metaverse/static/sky3d.js'
      - 'metaverse/static/sky-world-physics.js'
      - 'metaverse/world_builder.py'
      - 'metaverse/api.py'
      - 'metaverse/static/index.html'
      - 'metaverse/static/sky.css'
      - 'tests/test_sky_metaverse_reliability.py'
      - 'tests/test_sky_world_builder.py'
      - 'tests/test_sky_world_physics.cjs'
      - '.github/workflows/sky-metaverse-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-metaverse-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install testable SKY API dependencies
        run: python -m pip install -r requirements_social.txt -r requirements_studio.txt pytest
      - name: Check real-world browser syntax and server module syntax
        run: |
          node --check metaverse/static/sky3d.js
          node --check metaverse/static/sky-world-physics.js
          python -m py_compile metaverse/world_builder.py metaverse/api.py
      - name: Exercise real collision rules in Node
        run: node --test tests/test_sky_world_physics.cjs
      - name: Test real API, SQLite, GLB, builder, WebSocket and avatars
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_metaverse_reliability.py tests/test_sky_world_builder.py
