name: SKY Metaverse — functional worlds and real-time regression

on:
  pull_request:
    paths:
      - 'metaverse/static/sky3d.js'
      - 'metaverse/static/index.html'
      - 'metaverse/static/sky.css'
      - 'tests/test_sky_metaverse_reliability.py'
      - '.github/workflows/sky-metaverse-reliability.yml'
  push:
    branches: [main]
    paths:
      - 'metaverse/static/sky3d.js'
      - 'metaverse/static/index.html'
      - 'metaverse/static/sky.css'
      - 'tests/test_sky_metaverse_reliability.py'
      - '.github/workflows/sky-metaverse-reliability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functional-metaverse-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install testable SKY API dependencies
        run: python -m pip install -r requirements_social.txt -r requirements_studio.txt pytest
      - name: Check real-world browser script syntax
        run: node --check metaverse/static/sky3d.js
      - name: Test real API, local database, GLB and WebSocket
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_metaverse_reliability.py
