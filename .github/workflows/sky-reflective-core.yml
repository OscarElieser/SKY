name: SKY Reflective Core
on:
  push:
    paths:
      - 'neural_core/sky_reflective_core.py'
      - 'neural_core/sky_reflective_embeddings.py'
      - 'neural_core/sky_skill_builder.py'
      - 'neural_core/sky_cognition.py'
      - 'tests/test_sky_reflective_core.py'
      - 'tests/test_sky_cognition.py'
      - '.github/workflows/sky-reflective-core.yml'
  pull_request:
    paths:
      - 'neural_core/sky_reflective_core.py'
      - 'neural_core/sky_reflective_embeddings.py'
      - 'neural_core/sky_skill_builder.py'
      - 'neural_core/sky_cognition.py'
      - 'tests/test_sky_reflective_core.py'
      - 'tests/test_sky_cognition.py'
      - '.github/workflows/sky-reflective-core.yml'
permissions:
  contents: read
jobs:
  reflection:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements_studio.txt pytest
      - name: Compile cognitive modules
        run: python -m compileall -q neural_core/sky_reflective_core.py neural_core/sky_reflective_embeddings.py neural_core/sky_skill_builder.py neural_core/sky_cognition.py
      - name: Offline reflective and existing skill builder regression
        run: python -m pytest -q tests/test_sky_reflective_core.py tests/test_sky_v12_4_habilidades.py tests/test_sky_cognition.py
