name: SKY v10.6 global voice and recovery verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: |
          python -m pip install -r requirements_studio.txt pytest
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
      - name: Syntax of local Windows updater
        run: python -m py_compile scripts/APLICAR_SKY_LATENCIA_VOZ.py
      - name: Regression tests
        run: PYTHONPATH=. pytest -q tests/test_sky_v10_5_global.py tests/test_sky_v10_6_global.py tests/test_sky_latency_and_wordless_voice.py tests/test_sky_hud_chat_voice_bridge.py tests/test_sky_voice_single_instance.py
      - name: Local encrypted recovery rehearsal
        env:
          SKY_BACKUP_PASSPHRASE: test-only-password-for-ci-not-for-production
        run: python -m neural_core.sky_recovery_drill_v106
      - name: Code security patterns
        run: python scripts/security_audit_v103.py .
      - name: JavaScript syntax
        run: |
          node --check metaverse/static/creative.js
          node --check metaverse/static/hud.js
