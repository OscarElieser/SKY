name: SKY Extension Hub and verified learning
on:
  push:
    branches: [main, 'feat/sky-extension-hub-*']
    paths:
      - 'neural_core/sky_extension_hub.py'
      - 'neural_core/sky_experience_learning.py'
      - 'neural_core/sky_execution_cycle.py'
      - 'metaverse/api.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_extension_learning.py'
      - '.github/workflows/sky-extension-learning.yml'
  pull_request:
    paths:
      - 'neural_core/sky_extension_hub.py'
      - 'neural_core/sky_experience_learning.py'
      - 'neural_core/sky_execution_cycle.py'
      - 'metaverse/api.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/static/hud.js'
      - 'tests/test_sky_extension_learning.py'
      - '.github/workflows/sky-extension-learning.yml'
permissions:
  contents: read
jobs:
  verified-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python test dependencies
        run: python -m pip install 'pytest>=8,<10' 'httpx>=0.27,<1' 'fastapi>=0.115,<1'
      - name: Python syntax and JavaScript validity
        run: |
          python -m compileall -q neural_core/sky_extension_hub.py neural_core/sky_experience_learning.py neural_core/sky_execution_cycle.py metaverse/api.py metaverse/asistente_api.py
          node --check metaverse/static/hud.js
      - name: Verify no automatic execution and previous cycle/skillpack behavior
        run: python -m pytest -q tests/test_sky_extension_learning.py tests/test_sky_execution_cycle.py tests/test_sky_skillpack.py
