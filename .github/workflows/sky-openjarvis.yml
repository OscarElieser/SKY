name: SKY OpenJarvis optional integration
on:
  pull_request:
    paths:
      - 'neural_core/providers.py'
      - 'neural_core/sky_openjarvis.py'
      - 'neural_core/sky_diagnostico.py'
      - 'tests/test_sky_openjarvis_integration.py'
      - '.github/workflows/sky-openjarvis.yml'
  push:
    branches:
      - 'integracion/openjarvis-opcional'
    paths:
      - 'neural_core/providers.py'
      - 'neural_core/sky_openjarvis.py'
      - 'neural_core/sky_diagnostico.py'
      - 'tests/test_sky_openjarvis_integration.py'
      - '.github/workflows/sky-openjarvis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-isolation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile integration modules
        run: python -m py_compile neural_core/sky_openjarvis.py neural_core/providers.py neural_core/sky_diagnostico.py
      - name: Verify SKY isolation without services or secrets
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_openjarvis_integration.py
