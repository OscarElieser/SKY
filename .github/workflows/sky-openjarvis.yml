name: SKY OpenJarvis optional integration
on:
  pull_request:
    paths:
      - 'neural_core/providers.py'
      - 'neural_core/sky_openjarvis.py'
      - 'neural_core/sky_diagnostico.py'
      - 'tests/test_sky_openjarvis_integration.py'
      - 'tests/test_sky_unified_agents.py'
      - 'neural_core/sky_unified_agents.py'
      - 'neural_core/sky_openjarvis_boot.py'
      - 'neural_core/sky_asistente_personal.py'
      - 'neural_core/assistant.py'
      - 'metaverse/asistente_api.py'
      - 'iniciar_sky_autonomo.py'
      - '.github/workflows/sky-openjarvis.yml'
  push:
    branches:
      - 'integracion/openjarvis-opcional'
    paths:
      - 'neural_core/providers.py'
      - 'neural_core/sky_openjarvis.py'
      - 'neural_core/sky_diagnostico.py'
      - 'tests/test_sky_openjarvis_integration.py'
      - 'tests/test_sky_unified_agents.py'
      - 'neural_core/sky_unified_agents.py'
      - 'neural_core/sky_openjarvis_boot.py'
      - 'neural_core/sky_asistente_personal.py'
      - 'neural_core/assistant.py'
      - 'metaverse/asistente_api.py'
      - 'iniciar_sky_autonomo.py'
      - '.github/workflows/sky-openjarvis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-isolation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest python-dotenv
      - name: Compile integration modules
        run: python -m py_compile neural_core/sky_openjarvis.py neural_core/sky_openjarvis_boot.py neural_core/sky_unified_agents.py neural_core/providers.py neural_core/sky_diagnostico.py neural_core/sky_asistente_personal.py neural_core/assistant.py metaverse/asistente_api.py iniciar_sky_autonomo.py
      - name: Verify SKY isolation without services or secrets
        run: PYTHONPATH=. python -m pytest -q tests/test_sky_openjarvis_integration.py tests/test_sky_unified_agents.py tests/test_multiia.py
