name: SKY Android - runtime emulator smoke
on:
  push:
    branches: [main]
    paths:
      - 'mobile/android-agent/app/src/main/**'
      - 'mobile/android-agent/app/src/test/**'
      - 'mobile/android-agent/app/src/androidTest/**'
      - 'mobile/android-agent/app/build.gradle.kts'
      - '.github/workflows/sky-android-runtime-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sky-android-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator-android-35:
    name: Real Android 35 runtime tests (emulator, NOT Samsung)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable /dev/kvm for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests & compile Android debug APK
        run: gradle -p mobile/android-agent :app:testStandardDebugUnitTest :app:assembleStandardDebug --no-daemon
      - name: Test inside booted Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle -p mobile/android-agent :app:connectedStandardDebugAndroidTest --no-daemon
