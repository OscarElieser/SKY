name: SKY API - Windows verification
on:
  pull_request:
    paths:
      - "agente_dispositivo.py"
      - "metaverse/asistente_api.py"
      - "metaverse/hud_api.py"
      - "metaverse/static/hud.js"
      - "neural_core/action_verifier.py"
      - "neural_core/dispositivos.py"
      - "neural_core/sky_approvals.py"
      - "neural_core/sky_execution_metrics.py"
      - "tests/test_sky_api_*.py"
      - "tests/test_windows_desktop_control.py"
      - "tests/test_sky_subagents.py"
      - "neural_core/sky_subagents.py"
      - "neural_core/sky_internal_roles.py"
      - "neural_core/sky_supervisor.py"
      - "neural_core/sky_advanced_planner.py"
      - "neural_core/sky_capability_inventory.py"
      - "tests/test_sky_advanced_planner.py"
      - "tests/test_sky_neural_memory_sentinel.py"
      - "tests/test_sky_multimodal_reader.py"
      - "tests/test_sky_guardian.py"
      - "tests/test_sky_mobile_unlock.py"
      - "scripts/sky_mobile_usb_check.py"
      - "neural_core/sky_mobile_unlock.py"
      - "metaverse/mobile_unlock_api.py"
      - "neural_core/sky_secure_connectivity.py"
      - "metaverse/device_hub_api.py"
      - "tests/test_sky_secure_connectivity.py"
      - "tests/test_sky_s23fe_knowledge.py"
      - "neural_core/sky_knowledge_library.py"
      - "metaverse/knowledge_api.py"
      - "neural_core/sky_mobile_unlock.py"
      - "neural_core/sky_guardian.py"
      - "metaverse/guardian_api.py"
      - "neural_core/sky_multimodal_reader.py"
      - "metaverse/multimodal_api.py"
      - "neural_core/sky_neural_memory.py"
      - "neural_core/sky_sentinel_guard.py"
      - "metaverse/neural_memory_api.py"
      - "metaverse/security_api.py"
      - "metaverse/security_v101.py"
      - "tests/test_sky_supervisor.py"
      - "tests/test_sky_central_roles.py"
      - "metaverse/workflow_api.py"
      - "scripts/sky_api_smoke_windows.py"
      - ".github/workflows/sky-api-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-api-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SKY API and testing dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_studio.txt pytest
      - name: Compile SKY API modules
        shell: pwsh
        run: |
          python -m py_compile metaverse/asistente_api.py metaverse/hud_api.py agente_dispositivo.py neural_core/action_verifier.py neural_core/sky_approvals.py neural_core/sky_execution_metrics.py neural_core/sky_advanced_planner.py neural_core/sky_capability_inventory.py neural_core/sky_neural_memory.py neural_core/sky_sentinel_guard.py metaverse/neural_memory_api.py metaverse/security_api.py metaverse/multimodal_api.py neural_core/sky_multimodal_reader.py metaverse/guardian_api.py neural_core/sky_guardian.py neural_core/sky_mobile_unlock.py metaverse/mobile_unlock_api.py neural_core/sky_secure_connectivity.py metaverse/device_hub_api.py neural_core/sky_knowledge_library.py metaverse/knowledge_api.py scripts/sky_mobile_usb_check.py scripts/sky_api_smoke_windows.py
      - name: Test action approvals, receipts and localhost API on Windows
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m pytest -q tests/test_sky_api_verificacion_real.py tests/test_sky_api_aprobaciones_kpis.py tests/test_sky_subagents.py tests/test_sky_central_roles.py tests/test_sky_supervisor.py tests/test_sky_advanced_planner.py tests/test_sky_neural_memory_sentinel.py tests/test_sky_multimodal_reader.py tests/test_sky_guardian.py tests/test_sky_mobile_unlock.py tests/test_sky_secure_connectivity.py tests/test_sky_s23fe_knowledge.py
      - name: Test Windows agent controls without modifying user devices
        shell: pwsh
        run: |
          $env:PYTHONPATH = "."
          python -m pytest -q tests/test_windows_desktop_control.py
