name: SKY v10.8 isolated readiness checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install -r requirements_studio.txt -r requirements_production.txt pytest PyYAML
      - name: Validate isolated operator controls
        run: PYTHONPATH=. pytest -q tests/test_sky_v10_7_public.py tests/test_sky_v10_8_operations.py
      - name: Static container preflight
        run: python -m scripts.container_preflight_v108
      - name: Encrypted synthetic disaster recovery drill
        env:
          SKY_BACKUP_PASSPHRASE: ci-only-no-real-password-2026
        run: python -m scripts.disaster_recovery_v107
      - name: Secret scan (heuristic)
        run: python scripts/security_audit_v103.py .
  isolated-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --pull -f deploy/Dockerfile -t sky-ci:v10.8 .
      - name: Import API inside offline container (no published ports)
        env:
          SKY_SMOKE_IMAGE: sky-ci:v10.8
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python -m scripts.container_preflight_v108 --runtime
