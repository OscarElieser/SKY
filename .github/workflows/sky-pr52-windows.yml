name: SKY PR52 Windows validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows Python dependencies
        run: python -m pip install -r requirements_studio.txt pytest
      - name: Windows syntax checks
        run: |
          python -m py_compile iniciar_sky_autonomo.py neural_core/sky_voice_single_instance.py neural_core/sky_audio_devices.py metaverse/api.py neural_core/sky_http_metrics_queue.py sky_manos_libres.py scripts/APLICAR_SKY_LATENCIA_VOZ.py scripts/sky_windows_pr52_acceptance.py scripts/sky_pr52_reconcile_local.py scripts/sky_pr52_fix_chat_panel.py scripts/sky_pr52_single_listener_fix.py scripts/sky_pr52_audio_input_fix.py scripts/sky_pr52_chat_surgical_repair.py scripts/sky_pr52_hud_only_repair.py scripts/sky_pr52_api_brain_diagnostics.py scripts/sky_pr52_live_news_install.py scripts/sky_pr52_ctrl_f4_install.py scripts/sky_pr52_ctrl_f4_ast_install.py neural_core/sky_keyboard_shortcuts.py neural_core/sky_live_updates.py scripts/sky_runtime_full_audit.py
          node --check metaverse/static/hud.js
      - name: Windows local voice and metrics regressions
        run: python -m pytest -q tests/test_sky_latency_and_wordless_voice.py tests/test_sky_hud_chat_voice_bridge.py tests/test_sky_voice_single_instance.py tests/test_sky_runtime_full_audit.py tests/test_sky_audio_devices.py tests/test_sky_pr52_chat_surgical_repair.py tests/test_sky_pr52_hud_only_repair.py tests/test_sky_supervisor_existing_service.py tests/test_sky_pr52_api_brain_diagnostics.py tests/test_sky_live_updates.py tests/test_sky_pr52_live_news_install.py tests/test_sky_keyboard_shortcuts.py tests/test_sky_pr52_ctrl_f4_install.py tests/test_sky_pr52_ctrl_f4_ast_install.py tests/test_sky_pr52_reconcile_local.py
      - name: Windows report (no real owner's hardware)
        run: |
          python -c "import platform; print('SKY Windows CI:', platform.platform())"
          echo "PASS means synthetic tests ran on a Windows GitHub runner; microphone, Word, owner's permissions, and Ollama require physical PC tests."
