name: SKY Aula multimedia 3D y evaluación
on:
  push:
    branches: [main, 'feat/sky-docente-*']
    paths:
      - 'neural_core/sky_aula.py'
      - 'neural_core/sky_aula_multimedia.py'
      - 'neural_core/sky_aula_assessment.py'
      - 'metaverse/academy_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'metaverse/static/sky-aula-computer-3d.html'
      - 'tests/test_sky_aula_multimedia_assessment.py'
      - '.github/workflows/sky-aula-multimedia.yml'
  pull_request:
    paths:
      - 'neural_core/sky_aula.py'
      - 'neural_core/sky_aula_multimedia.py'
      - 'neural_core/sky_aula_assessment.py'
      - 'metaverse/academy_api.py'
      - 'metaverse/api.py'
      - 'metaverse/static/hud.js'
      - 'metaverse/static/sky-aula-computer-3d.html'
      - 'tests/test_sky_aula_multimedia_assessment.py'
      - '.github/workflows/sky-aula-multimedia.yml'
permissions:
  contents: read
jobs:
  aula-multimedia:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated tests
        run: python -m pip install 'pytest>=8,<10' 'fastapi>=0.115,<1' 'httpx>=0.27,<1'
      - name: Compile Python and validate HUD
        run: |
          python -m compileall -q neural_core/sky_aula.py neural_core/sky_aula_multimedia.py neural_core/sky_aula_assessment.py metaverse/academy_api.py metaverse/api.py
          node --check metaverse/static/hud.js
      - name: Validate embedded 3D module JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('metaverse/static/sky-aula-computer-3d.html').read_text()
          script=re.search(r'<script type="module">([\s\S]+?)</script>',text)
          assert script,'missing interactive Three.js module'
          Path('/tmp/sky-aula-3d.mjs').write_text(script.group(1))
          PY
          node --check /tmp/sky-aula-3d.mjs
      - name: Validate original Aula, resources, 3D and teacher-led assessments
        run: python -m pytest -q tests/test_sky_aula_multimedia_assessment.py tests/test_sky_execution_cycle.py tests/test_sky_skillpack.py
