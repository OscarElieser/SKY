name: SKY Aula - pruebas de docencia e innovacion
on:
  pull_request:
    paths:
      - 'neural_core/sky_aula.py'
      - 'neural_core/sky_evidence_lab.py'
      - 'neural_core/sky_innovation_lab.py'
      - 'neural_core/sky_knowledge_library.py'
      - 'neural_core/sky_multimodal_reader.py'
      - 'metaverse/academy_voice.py'
      - 'metaverse/asistente_api.py'
      - 'metaverse/academy_api.py'
      - 'metaverse/api.py'
      - 'tests/test_sky_academy_innovation.py'
      - '.github/workflows/sky-academy-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  school-research-innovation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias existentes
        run: python -m pip install -r requirements_studio.txt -r requirements_social.txt pytest
      - name: Compilar e inspeccionar módulos
        run: python -m py_compile metaverse/academy_api.py neural_core/sky_aula.py neural_core/sky_evidence_lab.py neural_core/sky_innovation_lab.py neural_core/sky_knowledge_library.py neural_core/sky_multimodal_reader.py metaverse/academy_voice.py metaverse/asistente_api.py metaverse/api.py
      - name: Pruebas de docencia, investigacion y seguridad de la API
        run: PYTHONPATH=. pytest -q tests/test_sky_academy_innovation.py tests/test_sky_impacto.py
