# SKY v10.9 isolated, disposable INTEGRATION test stack.
# No public ports: only localhost:18443 to the TLS proxy.
# Never use this file as a production deployment manifest.
name: sky-v109-smoke
services:
  proxy:
    image: caddy:2.9-alpine
    ports:
      - "127.0.0.1:18443:443"
    volumes:
      - ./Caddy.integration:/etc/caddy/Caddyfile:ro
      - smoke_caddy_data:/data
    networks: [front]
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 100
  api:
    image: ${SKY_SMOKE_IMAGE:-sky-v109:local}
    command: ["python", "-m", "uvicorn", "metaverse.api:app", "--host", "0.0.0.0", "--port", "8765", "--proxy-headers", "--forwarded-allow-ips", "*"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      SKY_DEPLOYMENT_MODE: public
      SKY_API_KEY_FILE: /run/secrets/sky_api_key
      SKY_OWNER_MFA_SECRET_FILE: /run/secrets/sky_mfa_seed
      SKY_TRUSTED_HOSTS: sky.test
      SKY_BEHIND_TLS_PROXY: "1"
      SKY_REDIS_URL: redis://redis:6379/0
      SKY_REDIS_PASSWORD_FILE: /run/secrets/sky_redis_password
      SKY_CREATIVE_WORKER: "0"
      SKY_WORKFLOWS_ENABLED: "0"
    secrets: [sky_api_key, sky_mfa_seed, sky_redis_password]
    volumes:
      - smoke_local:/app/local_data
      - smoke_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks: [front, internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 180
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8765/api/health',headers={'Host':'sky.test','X-Forwarded-Proto':'https'}),timeout=3)"]
      interval: 8s
      timeout: 5s
      start_period: 60s
      retries: 12
  renderer:
    image: ${SKY_SMOKE_IMAGE:-sky-v109:local}
    command: ["python", "sky_render_worker.py"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    network_mode: none
    environment:
      SKY_CREATIVE_WORKER: "0"
      SKY_WORKFLOWS_ENABLED: "0"
    volumes:
      - smoke_local:/app/local_data
      - smoke_data:/app/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 2g
    cpus: 2
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "/run/secrets/sky_redis_conf"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    secrets: [sky_redis_conf, sky_redis_password]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$(cat /run/secrets/sky_redis_password)\" redis-cli ping | grep -qx PONG"]
      interval: 8s
      timeout: 5s
      retries: 12
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 50
    mem_limit: 96m
networks:
  front: {}
  internal:
    internal: true
volumes:
  smoke_local: {}
  smoke_data: {}
  smoke_caddy_data: {}
secrets:
  sky_api_key:
    file: ./secrets/sky_api_key.txt
  sky_mfa_seed:
    file: ./secrets/sky_mfa_seed.txt
  sky_redis_password:
    file: ./secrets/sky_redis_password.txt
  sky_redis_conf:
    file: ./secrets/redis.conf
