# SKY v10.7 public deployment REFERENCE; requires real Docker/HTTPS testing.
# No direct host binding of API, Redis or renderer. Do not deploy without
# a security review, tested secret mounts, backup rotation and monitoring.
name: sky-ia
services:
  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SKY_PUBLIC_DOMAIN: ${SKY_PUBLIC_DOMAIN:?set SKY_PUBLIC_DOMAIN in deploy/production.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 100
    mem_limit: 256m
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    environment:
      SKY_DEPLOYMENT_MODE: public
      SKY_API_KEY_FILE: /run/secrets/sky_api_key
      SKY_OWNER_MFA_SECRET_FILE: /run/secrets/sky_mfa_seed
      SKY_TRUSTED_HOSTS: ${SKY_PUBLIC_DOMAIN:?set SKY_PUBLIC_DOMAIN}
      SKY_BEHIND_TLS_PROXY: "1"
      SKY_REDIS_URL: redis://redis:6379/0
      SKY_REDIS_PASSWORD_FILE: /run/secrets/sky_redis_password
      SKY_CREATIVE_WORKER: "0"
      SKY_WORKFLOWS_ENABLED: "0"
      SKY_STT_MODEL_DIR: /app/models/whisper
    secrets: [sky_api_key, sky_mfa_seed, sky_redis_password]
    volumes:
      - sky_local:/app/local_data
      - sky_data:/app/data
      - ./models/whisper:/app/models/whisper:ro
    depends_on:
      redis: {condition: service_healthy}
    networks: [edge, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 180
    mem_limit: 2g
    cpus: 2.0
  renderer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "sky_render_worker.py"]
    # Separate liveness probe: renderer exposes NO HTTP port or network route.
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.renderer_health_v110"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    network_mode: none
    environment:
      SKY_CREATIVE_WORKER: "0"
      SKY_WORKFLOWS_ENABLED: "0"
    volumes:
      - sky_local:/app/local_data
      - sky_data:/app/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 2g
    cpus: 2.0
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "/run/secrets/sky_redis_conf"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    secrets: [sky_redis_conf]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -Eq 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 50
    mem_limit: 96m
networks:
  edge: {}
  backend:
    internal: true
volumes:
  sky_local: {}
  sky_data: {}
  caddy_data: {}
  caddy_config: {}
secrets:
  sky_api_key: {file: ./secrets/sky_api_key.txt}
  sky_mfa_seed: {file: ./secrets/sky_mfa_seed.txt}
  sky_redis_password: {file: ./secrets/sky_redis_password.txt}
  sky_redis_conf: {file: ./secrets/redis.conf}
